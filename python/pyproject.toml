[project]
name = "triggerware"
version = "1.0.3"
description = "Async Python SDK for Triggerware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tw2-jsonrpc", "pyyaml"]

[project.optional-dependencies]
websockets = ["tw2-jsonrpc[websockets]"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
