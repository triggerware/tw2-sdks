[project]
name = "triggerware"
version = "1.0.0"
description = "Async Python SDK for Triggerware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pysonrpc", "pyyaml"]

[project.optional-dependencies]
websockets = ["pysonrpc[websockets]"]

[tool.uv.sources]
pysonrpc = { path = "../../jsonrpc/pysonrpc" }

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
